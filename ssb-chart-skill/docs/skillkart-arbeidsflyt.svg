<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="1040" height="1150" viewBox="0 0 1040 1150" role="img" aria-label="Arbeidsflyt i ni steg fra en JSON-stat2-respons hentet med ssb-pxwebapi-v2 til et ferdig diagram: avgjør rendringsmål, velg diagramtype, gjør JSON-stat2 om til datasett, farger, typografi, tittel og kilde, tabeller, format og sjekkliste. Rendringsmålet deler flyten i A, inline chat-widget, og B, frittstående leveranse. Data-blekket er SSB-farger i begge. Resten følger verten i A og SSB-stilen i B.">
<title>Arbeidsflyt i ni steg fra en JSON-stat2-respons hentet med ssb-pxwebapi-v2 til et ferdig diagram: avgjør rendringsmål, velg diagramtype, gjør JSON-stat2 om til datasett, farger, typografi, tittel og kilde, tabeller, format og sjekkliste. Rendringsmålet deler flyten i A, inline chat-widget, og B, frittstående leveranse. Data-blekket er SSB-farger i begge. Resten følger verten i A og SSB-stilen i B.</title>
<style>
svg.dg { --bg: #F3F5F8; --surface: #FFFFFF; --panel: #E8ECF1; --ink: #17202B; --ink2: #4C5765; --line: #C3CBD5; --accent: #0A6A88; --tag: #DDE3EA;
