<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="1040" height="356" viewBox="0 0 1040 356" role="img" aria-label="Ingen skript sjekker innholdet i ssb-chart. Hex-verdiene holdes like med grep mot color-system.md, og kodesnuttene i format-guidelines.md kontrolleres mot reglene i SKILL.md for hånd. SKILL.md, references, README, CHANGELOG og LICENSE pakkes av build_zip.sh til ssb-chart-skill.zip, og CI sjekker at den committede zip-en stemmer. docs, CLAUDE.md, DEVLOG.md og scripts følger ikke med.">
<title>Ingen skript sjekker innholdet i ssb-chart. Hex-verdiene holdes like med grep mot color-system.md, og kodesnuttene i format-guidelines.md kontrolleres mot reglene i SKILL.md for hånd. SKILL.md, references, README, CHANGELOG og LICENSE pakkes av build_zip.sh til ssb-chart-skill.zip, og CI sjekker at den committede zip-en stemmer. docs, CLAUDE.md, DEVLOG.md og scripts følger ikke med.</title>
<style>
svg.dg { --bg: #F3F5F8; --surface: #FFFFFF; --panel: #E8ECF1; --ink: #17202B; --ink2: #4C5765; --line: #C3CBD5; --accent: #0A6A88; --tag: #DDE3EA;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
@media (prefers-color-scheme: dark) { svg.dg { --bg: #10151B; --surface: #18202A; --panel: #141B23; --ink: #E3E8EE; --ink2: #9AA6B3; --line: #3A4552; --accent: #5DB9D7; --tag: #27313C; } }
.dg .bg { fill: var(--bg); }
.dg .title { font-size: 15px; font-weight: 600; }
.dg text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.dg .t { font-size: 13px; font-weight: 600; }
.dg .n { fill: var(--ink2); font-weight: 500; }
.dg .mn { font-family: var(--mono); font-size: 12px; }
.dg .m { font-family: var(--mono); font-size: 11px; }
.dg .r { font-family: var(--mono); font-size: 11px; fill: var(--ink2); }
.dg .lbl { font-size: 11px; fill: var(--ink2); }
.dg .cap { font-family: var(--mono); font-size: 11px; fill: var(--ink2); letter-spacing: .08em; font-weight: 600; }
.dg .hot-t { fill: var(--accent); font-weight: 600; font-size: 11px; }
.dg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.dg .ext { fill: var(--bg); stroke: var(--line); stroke-dasharray: 4 3; }
.dg .quiet { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
.dg .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.dg .pill { fill: var(--surface); stroke: var(--ink2); stroke-width: 1; }
.dg .wire { stroke: var(--ink2); stroke-width: 1.4; fill: none; }
.dg .route { stroke-dasharray: 5 4; }
.dg .hot { stroke: var(--accent); stroke-width: 2.4; fill: none; }
.dg .brk { stroke: var(--ink2); stroke-width: 1.4; fill: none; }
.dg .mk { fill: var(--ink2); }
.dg .mk-hot { fill: var(--accent); }
.dg .tagbox { fill: var(--tag); stroke: var(--line); stroke-width: 1; }
.dg .tagtx { font-family: var(--mono); font-size: 9.5px; font-weight: 600; fill: var(--ink2); }
.dg .quiet-t { fill: var(--ink2); }
</style>
<rect width="1040" height="356" class="bg"/>
<text x="16" y="24" class="title">ssb-chart · sjekk og pakking</text>
<text x="1024" y="24" text-anchor="end" class="r">v1.3 · tegnet 2026-10-15</text>
<g transform="translate(0 16)">
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk"/></marker>
</defs>

<!-- Source files -->
<rect x="16" y="40" width="270" height="40" rx="5" class="box"/>
<text x="30" y="57" class="mn">SKILL.md</text>
<text x="30" y="72" class="lbl">prinsipper, rendringsmål, palett, sjekkliste</text>

<rect x="16" y="88" width="270" height="40" rx="5" class="box"/>
