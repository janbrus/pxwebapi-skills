<text x="30" y="249" class="mn quiet-t">docs/</text>
<text x="30" y="264" class="lbl">dette skillkartet, ikke i zip</text>

<rect x="16" y="280" width="270" height="40" rx="5" class="quiet"/>
<text x="30" y="297" class="mn quiet-t">CLAUDE.md · DEVLOG.md · scripts/</text>
<text x="30" y="312" class="lbl">internt, aldri i zip</text>

<!-- Bracket: packed (items 1–4) -->
<path d="M292 44 H300 V220 H292" class="brk"/>
<line x1="300" y1="214" x2="394" y2="214" class="wire" marker-end="url(#f2a)"/>
<text x="347" y="208" text-anchor="middle" class="lbl">pakkes</text>

<!-- Bracket: checked by hand (items 1–2) -->
<path d="M316 44 H324 V124 H316" class="brk"/>
<line x1="324" y1="84" x2="394" y2="84" class="wire" marker-end="url(#f2a)"/>
<text x="359" y="78" text-anchor="middle" class="lbl">regler</text>

<!-- Checked by hand -->
<rect x="396" y="40" width="320" height="128" rx="6" class="box"/>
<text x="412" y="62" class="t">Sjekkes for hånd</text>
<text x="412" y="84" class="lbl">Ingen skript sjekker innholdet</text>
<text x="412" y="102" class="lbl">Snuttene i format-guidelines.md må følge SKILL.md:</text>
<text x="412" y="118" class="lbl">legend aldri nederst, y-akse fra 0, kildelinje</text>
<text x="412" y="138" class="lbl">jsonstat-to-chart.md er kjørt i node 2026-10-02</text>
<text x="412" y="156" class="lbl">Hver regel sier hvilket rendringsmål den gjelder</text>

<!-- Source of truth -->
<rect x="796" y="40" width="228" height="128" rx="6" class="panel"/>
<text x="812" y="62" class="t">Fasit for fargene</text>
<text x="812" y="84" class="m">color-system.md</text>
<text x="812" y="104" class="lbl">bygger på SSBs designsystem</text>
<text x="812" y="120" class="lbl">og Plotly-malen</text>
<text x="812" y="144" class="lbl">endres én hex, endres alle</text>
<line x1="716" y1="96" x2="794" y2="96" class="wire" marker-end="url(#f2a)"/>
<text x="756" y="90" text-anchor="middle" class="lbl">grep -rn</text>
<line x1="796" y1="112" x2="718" y2="112" class="wire" marker-end="url(#f2a)"/>
<text x="756" y="126" text-anchor="middle" class="lbl">alle treff</text>

<!-- Build -->
<rect x="396" y="184" width="320" height="60" rx="6" class="box"/>
<text x="412" y="206" class="m">scripts/build_zip.sh</text>
<text x="412" y="224" class="lbl">toppmappe ssb-chart/, brukerfiler + LICENSE</text>
<line x1="716" y1="214" x2="794" y2="214" class="wire" marker-end="url(#f2a)"/>
<text x="756" y="208" text-anchor="middle" class="lbl">bygger</text>

<rect x="796" y="184" width="228" height="60" rx="6" class="box"/>
<text x="812" y="206" class="m">ssb-chart-skill.zip</text>
<text x="812" y="224" class="lbl">lastes opp i Claude.ai</text>
<text x="396" y="270" class="lbl">CI zip-sync (check-chart-zip.yaml) bygger zip-en på nytt ved push</text>
<text x="396" y="286" class="lbl">og kjører diff -r mot den committede</text>
</g>
