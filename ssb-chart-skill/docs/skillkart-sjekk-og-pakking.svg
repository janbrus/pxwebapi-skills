<text x="30" y="120" class="lbl">4 referansefiler, lastes ved behov</text>

<rect x="16" y="136" width="270" height="40" rx="5" class="box"/>
<text x="30" y="153" class="mn">README.md · CHANGELOG.md</text>
<text x="30" y="168" class="lbl">installasjon og endringslogg</text>

<rect x="16" y="184" width="270" height="40" rx="5" class="box"/>
<text x="30" y="201" class="mn">LICENSE</text>
<text x="30" y="216" class="lbl">MIT, ligger i repo-roten</text>

