<text x="392" y="206" class="m">scripts/build_zip.sh</text>
<text x="392" y="224" class="lbl">copies the user files + LICENSE</text>
<line x1="666" y1="214" x2="734" y2="214" class="wire" marker-end="url(#f2a)"/>
<text x="700" y="208" text-anchor="middle" class="lbl">builds</text>

<rect x="736" y="184" width="208" height="60" rx="6" class="box"/>
<text x="752" y="206" class="m">generic-pxweb-v1-skill.zip</text>
<text x="752" y="224" class="lbl">upload to Claude.ai</text>
