<svg xmlns="http://www.w3.org/2000/svg" class="dg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-label="SKILL.md, references, README, CHANGELOG and LICENSE are packed by build_zip.sh into generic-pxweb-v1-skill.zip, and CI checks that the committed zip matches a fresh build. There is no example checker. Claims are probed with curl on live installations and dated in DEVLOG.md. docs holds an llms.txt template for agencies and this skill map; it stays out of the zip with CLAUDE.md, DEVLOG.md, evals and scripts.">
<title>SKILL.md, references, README, CHANGELOG and LICENSE are packed by build_zip.sh into generic-pxweb-v1-skill.zip, and CI checks that the committed zip matches a fresh build. There is no example checker. Claims are probed with curl on live installations and dated in DEVLOG.md. docs holds an llms.txt template for agencies and this skill map; it stays out of the zip with CLAUDE.md, DEVLOG.md, evals and scripts.</title>
<style>
svg.dg { --bg: #F3F5F8; --surface: #FFFFFF; --panel: #E8ECF1; --ink: #17202B; --ink2: #4C5765; --line: #C3CBD5; --accent: #0A6A88; --tag: #DDE3EA;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
@media (prefers-color-scheme: dark) { svg.dg { --bg: #10151B; --surface: #18202A; --panel: #141B23; --ink: #E3E8EE; --ink2: #9AA6B3; --line: #3A4552; --accent: #5DB9D7; --tag: #27313C; } }
.dg .bg { fill: var(--bg); }
.dg .title { font-size: 15px; font-weight: 600; }
.dg text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.dg .t { font-size: 13px; font-weight: 600; }
