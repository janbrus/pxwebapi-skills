<text x="392" y="84" class="lbl">No example checker: each claim is reproduced</text>
<text x="392" y="100" class="lbl">with curl and dated in DEVLOG.md</text>
<text x="392" y="120" class="lbl">?config outranks every published limit</text>
<text x="392" y="136" class="lbl">docs/ Finland example: re-probed by hand</text>
<text x="392" y="156" class="lbl">evals/: end-to-end scenarios</text>

